apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'

group = 'com.routemasterpro.routeoptimizer'
version = '0.1.0'

android {
  namespace "com.routemasterpro.routeoptimizer"
  compileSdkVersion safeExtGet("compileSdkVersion", 34)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 34)

    ndk {
      // Mobile ABIs we ship librmp_routing.so for.
      // x86_64 is included for emulator builds.
      abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  sourceSets {
    main {
      // Pre-built .so files produced by mobile-core/scripts/build-android.sh
      jniLibs.srcDirs = ['src/main/jniLibs']
    }
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${safeExtGet('kotlinVersion', '1.9.25')}"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

  // JNA is required by UniFFI-generated Kotlin bindings to dlopen librmp_routing.so.
  implementation "net.java.dev.jna:jna:5.14.0@aar"
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
