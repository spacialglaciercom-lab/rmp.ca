# Cloud Build: build from repo root Dockerfile and deploy to Cloud Run.
steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/${PROJECT_ID}/trashroute-api:${SHORT_SHA}"
      - "-t"
      - "gcr.io/${PROJECT_ID}/trashroute-api:latest"
      - "."
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/${PROJECT_ID}/trashroute-api:${SHORT_SHA}"
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/${PROJECT_ID}/trashroute-api:latest"
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "trashroute-mobile"
      - "--image"
      - "gcr.io/${PROJECT_ID}/trashroute-api:${SHORT_SHA}"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _REGION: northamerica-northeast1
images:
  - "gcr.io/${PROJECT_ID}/trashroute-api:${SHORT_SHA}"
  - "gcr.io/${PROJECT_ID}/trashroute-api:latest"
