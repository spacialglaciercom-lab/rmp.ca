# Nginx reverse proxy for the Python optimizer jail.
#
# Unlike the Docker version, we don't need the resolver/variable trick here:
# the "optimizer" hostname is resolved via /etc/hosts (written by deploy.sh),
# so startup order is guaranteed by Bastille before nginx launches.
#
# To front multiple optimizer jails, add more server lines to the upstream
# block and re-run: bastille cmd rmpca-nginx-opt service nginx reload

upstream optimizer_pool {
    server optimizer:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Pass real client IP downstream for logging
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host              $host;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Timeouts — optimizer can take up to 2 minutes for large city networks
    proxy_connect_timeout   10s;
    proxy_send_timeout      130s;
    proxy_read_timeout      130s;

    # Large GeoJSON payloads — match Node.js proxy behaviour
    client_max_body_size    50m;

    location / {
        proxy_pass http://optimizer_pool;
    }

    location /health {
        proxy_pass         http://optimizer_pool/health;
        proxy_read_timeout 5s;
    }
}
