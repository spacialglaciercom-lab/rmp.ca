# Redis configuration for rmpca-redis jail.
# Mirrors the docker-compose.optimizer.yml redis command flags.

bind 127.0.0.1
protected-mode yes
port 6379

# 256 MB cap with LRU eviction — sized for Celery result backend
maxmemory 256mb
maxmemory-policy allkeys-lru

# No persistence — result backend is ephemeral; in-flight tasks survive
# a FastAPI restart but not a Redis restart (acceptable trade-off).
save ""
appendonly no
