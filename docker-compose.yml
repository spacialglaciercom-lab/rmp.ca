# Default: backend + extract + vroom (no Python optimizer).
# For route optimization (CPP, zones): docker compose -f docker-compose.yml -f docker-compose.optimizer.yml --profile optimizer up
services:
  extract:
    build:
      context: ./extract
      dockerfile: Dockerfile
    container_name: rmpca-extract
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
    restart: unless-stopped

  vroom:
    image: ghcr.io/vroom-project/vroom-docker:v1.14.0
    container_name: rmpca-vroom
    ports:
      - "3004:3000"
    environment:
      - VROOM_ROUTER=osrm
    restart: unless-stopped

  optimizer:
    build:
      context: ./backend
      args:
        BASE_IMAGE: public.ecr.aws/docker/library/python:3.12-slim
    # No container_name — allows docker compose up --scale optimizer=N
    # No host port mapping — internal traffic only, routed via nginx-optimizer
    profiles: [optimizer]
    environment:
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  nginx-optimizer:
    image: nginx:1.27-alpine
    container_name: rmpca-nginx-optimizer
    profiles: [optimizer]
    volumes:
      - ./nginx/optimizer.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"
    depends_on:
      optimizer:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: public.ecr.aws/docker/library/node:20-alpine
    container_name: rmpca-backend
    ports:
      - "3000:3000"
    env_file:
      - .env.server
    environment:
      - PORT=3000
      # Extract and VROOM are always in the default stack. Optimizer is optional (see docker-compose.optimizer.yml).
      - EXTRACT_WS_UPSTREAM=http://extract:4000
      - VROOM_BACKEND_URL=http://vroom:3000
      # OPTIMIZER_BACKEND_URL set only when using optimizer profile: docker compose -f docker-compose.yml -f docker-compose.optimizer.yml --profile optimizer up
    depends_on:
      extract:
        condition: service_started
      vroom:
        condition: service_started
    restart: unless-stopped
