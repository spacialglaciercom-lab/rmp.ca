# Nginx reverse proxy for the Python optimizer service.
#
# Resolver + variable: upstream is resolved at REQUEST time, not at nginx startup.
# This avoids "host not found in upstream" when nginx starts before Docker DNS
# has the optimizer hostname ready (so the container stops restarting).
#
# Usage with Docker Compose scale:
#   docker compose up --scale optimizer=4
# Docker's embedded DNS (127.0.0.11); variable proxy_pass = resolve per request.

server {
    listen 80;
    server_name _;

    # Resolve upstream at request time (not at startup) to avoid "host not found"
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $optimizer_backend "optimizer:8000";

    # Pass real client IP downstream for logging
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host              $host;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Timeouts — optimizer can take up to 2 minutes for large city networks
    proxy_connect_timeout   10s;
    proxy_send_timeout      130s;
    proxy_read_timeout      130s;

    # Large GeoJSON payloads — match Node.js proxy behaviour
    client_max_body_size    50m;

    location / {
        proxy_pass http://$optimizer_backend;
    }

    location /health {
        proxy_pass         http://$optimizer_backend/health;
        proxy_read_timeout 5s;
    }
}
