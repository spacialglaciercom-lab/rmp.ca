# Nginx upstream load balancer for the Python optimizer service.
#
# Usage with Docker Compose scale:
#   docker compose up --scale optimizer=4
#
# Docker's embedded DNS resolver (127.0.0.11) resolves the service name
# "optimizer" to ALL running replica IPs, enabling true round-robin load
# balancing across N instances.
#
# Passive health checks: a replica is temporarily removed from rotation
# after 2 consecutive failures and re-checked after 10 seconds.

upstream optimizer_pool {
    # Docker Compose service name — resolves to all replicas via Docker DNS
    server optimizer:8000 max_fails=2 fail_timeout=10s;

    # Keep persistent connections to worker replicas to reduce TCP overhead
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Pass real client IP downstream for logging
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host              $host;

    # Reuse keepalive connections to upstream
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Timeouts — optimizer can take up to 2 minutes for large city networks
    proxy_connect_timeout   10s;
    proxy_send_timeout      130s;
    proxy_read_timeout      130s;

    # Large GeoJSON payloads — match Node.js proxy behaviour
    client_max_body_size    50m;

    # Route all traffic to the optimizer pool
    location / {
        proxy_pass http://optimizer_pool;
    }

    # Dedicated health endpoint used by Docker/k8s probes
    location /health {
        proxy_pass         http://optimizer_pool/health;
        proxy_read_timeout 5s;
    }
}
