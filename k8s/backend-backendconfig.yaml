# BackendConfig for the backend service.
# Sets a long connection timeout so WebSocket connections (/ws/extract)
# are not killed mid-session by the GKE L7 LoadBalancer (default is 30s).
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: backend-backendconfig
  namespace: rmpca
spec:
  timeoutSec: 3600   # 1 hour — keeps WebSocket connections alive
  connectionDraining:
    drainingTimeoutSec: 30
