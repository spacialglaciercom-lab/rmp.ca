apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: rmpca
  labels:
    app: backend
    component: node-api
  annotations:
    # Attach BackendConfig for WebSocket connection timeout (1 hour)
    cloud.google.com/backend-config: '{"default": "backend-backendconfig"}'
spec:
  # NodePort lets the GKE Ingress (backend-ingress.yaml) route to this service.
  # TLS is terminated at the Ingress (Google-managed cert for api.routemasterpro.ca).
  type: NodePort
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
