# Apply everything: kubectl apply -k k8s/
# Optional: to use self-hosted OSRM instead of public router.project-osrm.org, add an OSRM
# deployment+service (see docker-compose.osrm.yml + scripts/setup-osrm.sh) and set OSRM_URL in
# backend-secret (e.g. http://osrm.rmpca.svc.cluster.local:5000). The app reads it via GET /api/config.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  # Data layer
  - redis-deployment.yaml
  - redis-service.yaml
  # Extract (WebSocket / elevation)
  - extract-deployment.yaml
  - extract-service.yaml
  # Optimizer (FastAPI + Celery)
  - optimizer-deployment.yaml
  - optimizer-service.yaml
  - optimizer-hpa.yaml
  - celery-worker-deployment.yaml
  # Backend BFF (public-facing)
  - backend-deployment.yaml
  - backend-service.yaml
  - backend-backendconfig.yaml
  - managed-certificate.yaml
  - backend-ingress.yaml
  # Optional: OSRM self-hosted routing.
  # IMPORTANT: run the preprocess Job manually before applying this kustomization:
  #   kubectl apply -f k8s/osrm-pvc.yaml
  #   kubectl apply -f k8s/osrm-preprocess-job.yaml
  #   kubectl wait --for=condition=complete job/osrm-preprocess -n rmpca --timeout=2h
  # Then apply the deployment+service via this kustomization (or kubectl apply -k k8s/).
  # See k8s/README-OSRM.md for full instructions.
  - osrm-pvc.yaml
  - osrm-deployment.yaml
  - osrm-service.yaml
