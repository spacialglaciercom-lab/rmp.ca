apiVersion: apps/v1
kind: Deployment
metadata:
  name: extract
  namespace: rmpca
  labels:
    app: extract
    component: node-ws
spec:
  replicas: 1
  selector:
    matchLabels:
      app: extract
  template:
    metadata:
      labels:
        app: extract
        component: node-ws
    spec:
      containers:
        - name: extract
          # Replace PROJECT_ID with your GCP project ID
          image: northamerica-northeast1-docker.pkg.dev/PROJECT_ID/rmpca/extract:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: PORT
              value: "4000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 4
