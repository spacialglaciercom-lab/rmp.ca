apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: rmpca
  labels:
    app: backend
    component: node-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: backend
        component: node-api
    spec:
      containers:
        - name: backend
          # GCP project: careful-trainer-485803-a9
          image: northamerica-northeast1-docker.pkg.dev/careful-trainer-485803-a9/rmpca/backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            # Internal cluster DNS — matches service names in this namespace
            - name: EXTRACT_WS_UPSTREAM
              value: "http://extract.rmpca.svc.cluster.local:4000"
            - name: OPTIMIZER_BACKEND_URL
              value: "http://optimizer.rmpca.svc.cluster.local:8000"
          envFrom:
            - secretRef:
                name: backend-secret
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 4
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 30
