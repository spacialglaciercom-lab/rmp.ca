# HorizontalPodAutoscaler for the rmp.ca Python optimizer.
#
# Scaling behaviour:
#   - Scales UP  when average CPU > 70% (heavy optimization workload)
#   - Scales DOWN when average CPU < 30% (stable for 5 minutes to avoid flapping)
#   - Floor: 2 replicas (always HA, survives one pod failure)
#   - Ceiling: 10 replicas (city-wide contract worst case)
#
# Prerequisites:
#   kubectl apply -f k8s/optimizer-deployment.yaml
#   kubectl apply -f k8s/optimizer-service.yaml
#   # metrics-server must be installed in the cluster:
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#
# Deploy:
#   kubectl apply -f k8s/optimizer-hpa.yaml
#
# Monitor:
#   kubectl get hpa optimizer --watch
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: optimizer
  namespace: rmpca
  labels:
    app: optimizer
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: optimizer
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30       # react quickly to traffic spikes
      policies:
        - type: Pods
          value: 2                          # add at most 2 pods per scale event
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300      # wait 5 min before scaling down
      policies:
        - type: Pods
          value: 1                          # remove 1 pod at a time
          periodSeconds: 120
