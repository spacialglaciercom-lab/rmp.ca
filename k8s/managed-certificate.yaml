# Google-managed SSL certificate for the backend API.
#
# Prerequisites (run once):
#   1. Reserve a global static IP:
#        gcloud compute addresses create rmpca-backend-ip --global
#   2. Get the reserved IP:
#        gcloud compute addresses describe rmpca-backend-ip --global --format="get(address)"
#   3. Add a DNS A record:  api.rmp.ca → [IP from step 2]
#   4. Apply: kubectl apply -k k8s/
#
# The managed cert provisions automatically once DNS resolves (~5-60 min).
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: backend-managed-cert
  namespace: rmpca
spec:
  domains:
    - api.rmp.ca
