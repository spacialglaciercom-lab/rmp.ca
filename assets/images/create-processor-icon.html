<!DOCTYPE html>
<html lang="en">
<head>

    <title>Processor Icon Generator</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Courier New', monospace;
        }
        
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        button {
            padding: 10px 20px;
            background: #00d9ff;
            color: #000;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        
        button:hover {
            background: #00b8d4;
        }
        
        .icon-container {
            width: 1024px;
            height: 1024px;
            position: relative;
            border-radius: 180px;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #2a2a2a 100%);
            box-shadow: 0 0 50px rgba(0, 217, 255, 0.3);
        }
        
        .processor-die {
            position: absolute;
            top: 312px;
            left: 312px;
            width: 400px;
            height: 400px;
            border: 8px solid #FFD700;
            border-radius: 40px;
            background: #1a1a1a;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }
        
        .internal-grid {
            position: absolute;
            top: 362px;
            left: 362px;
            width: 300px;
            height: 300px;
            border: 4px solid #B87333;
            border-radius: 20px;
            opacity: 0.6;
        }
        
        .core-grid {
            position: absolute;
            top: 387px;
            left: 387px;
            width: 250px;
            height: 250px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 20px;
        }
        
        .core {
            background: #B87333;
            border-radius: 4px;
            box-shadow: 0 0 5px rgba(184, 115, 51, 0.8);
        }
        
        .connection-pad {
            position: absolute;
            width: 24px;
            height: 24px;
            background: #FFD700;
            border-radius: 6px;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.8);
        }
        
        .trace {
            position: absolute;
            background: #B87333;
            opacity: 0.6;
        }
        
        .trace-vertical {
            width: 2px;
        }
        
        .trace-horizontal {
            height: 2px;
        }
        
        .component {
            position: absolute;
            opacity: 0.7;
        }
        
        .resistor {
            width: 20px;
            height: 8px;
            background: #C0C0C0;
            border-radius: 2px;
        }
        
        .capacitor {
            width: 8px;
            height: 16px;
            position: relative;
        }
        
        .capacitor::before,
        .capacitor::after {
            content: '';
            position: absolute;
            width: 2px;
            height: 100%;
            background: #C0C0C0;
            left: 1px;
        }
        
        .capacitor::after {
            left: 5px;
        }
        
        .route-arrow {
            position: absolute;
            top: 462px;
            left: 472px;
            width: 80px;
            height: 100px;
            fill: #00d9ff;
            filter: drop-shadow(0 0 10px rgba(0, 217, 255, 0.8));
        }
        
        .decorative-trace {
            position: absolute;
            opacity: 0.4;
            stroke: #B87333;
            stroke-width: 2;
            fill: none;
        }
    </style>
</head>

    <script>
        function generateIcon() {
            // Add some animation or interactivity if needed
            const container = document.getElementById('iconContainer');
            container.style.animation = 'pulse 2s infinite';
        }
        
        function downloadIcon() {
            // Create a high-resolution canvas for download
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const size = 1024;
            
            canvas.width = size;
            canvas.height = size;
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#0a0a0a');
            gradient.addColorStop(0.5, '#1a1a1a');
            gradient.addColorStop(1, '#2a2a2a');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // Round corners
            ctx.globalCompositeOperation = 'destination-in';
            ctx.beginPath();
            ctx.roundRect(0, 0, size, size, 180);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';
            
            // This is a simplified version - in a real implementation you'd draw all the processor elements
            // For now, we'll use the HTML as reference and suggest using a proper graphics tool
            
            const link = document.createElement('a');
            link.download = 'processor-icon.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            
            alert('Icon generation started! For best results, use the SVG reference to create high-quality icons in a graphics editor like Figma, Sketch, or Adobe Illustrator.');
        }
        
        // Add CSS animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes pulse {
                0%, 100% { transform: scale(1); }
                50% { transform: scale(1.02); }
            }
        `;
        document.head.appendChild(style);
    </script>
