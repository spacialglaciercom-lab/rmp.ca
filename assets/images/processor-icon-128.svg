  <!-- Route Arrow -->
  <polygon points="512,462 492,482 492,472 472,472 472,552 492,552 492,542 512,562 532,542 532,552 552,552 552,472 532,472 532,482" fill="#00d9ff"/>
  
  <!-- Small Components -->
