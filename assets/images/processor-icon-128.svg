    <rect x="850" y="150" width="20" height="8" rx="2" fill="#C0C0C0"/>
    <rect x="150" y="850" width="20" height="8" rx="2" fill="#C0C0C0"/>
    <rect x="850" y="850" width="20" height="8" rx="2" fill="#C0C0C0"/>
